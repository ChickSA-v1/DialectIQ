[project]
name = "dialectiq"
version = "0.1.0"
description = "Saudi dialect-aware sentiment analysis engine powered by Claude"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
