<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <!-- Background glow -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Main dashboard card -->
  <g filter="url(#shadow1)">
    <rect x="60" y="60" width="480" height="340" rx="20" fill="white"/>
    <rect x="60" y="60" width="480" height="340" rx="20" fill="url(#grad1)" opacity="0.3"/>

    <!-- Dashboard header bar -->
    <rect x="60" y="60" width="480" height="56" rx="20" fill="url(#grad2)"/>
    <rect x="60" y="96" width="480" height="20" fill="url(#grad2)"/>
    <circle cx="92" cy="88" r="6" fill="white" opacity="0.4"/>
    <circle cx="112" cy="88" r="6" fill="white" opacity="0.4"/>
    <circle cx="132" cy="88" r="6" fill="white" opacity="0.4"/>
    <text x="300" y="93" fill="white" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" opacity="0.9">DialectIQ Dashboard</text>
  </g>

  <!-- Stats row -->
  <g filter="url(#shadow2)">
    <rect x="84" y="132" width="100" height="64" rx="12" fill="white"/>
    <text x="134" y="158" fill="#4F46E5" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">1,247</text>
    <text x="134" y="178" fill="#9CA3AF" font-family="sans-serif" font-size="10" text-anchor="middle">Reviews</text>
  </g>
  <g filter="url(#shadow2)">
    <rect x="196" y="132" width="100" height="64" rx="12" fill="white"/>
    <text x="246" y="158" fill="#059669" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">7.8</text>
    <text x="246" y="178" fill="#9CA3AF" font-family="sans-serif" font-size="10" text-anchor="middle">Sentiment</text>
  </g>
  <g filter="url(#shadow2)">
    <rect x="308" y="132" width="100" height="64" rx="12" fill="white"/>
    <text x="358" y="158" fill="#D97706" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">4.3</text>
    <text x="358" y="178" fill="#9CA3AF" font-family="sans-serif" font-size="10" text-anchor="middle">Rating</text>
    <!-- Stars -->
    <g transform="translate(330, 183)">
      <polygon points="6,0 7.8,4.5 12,4.5 8.7,7.3 9.9,12 6,9.5 2.1,12 3.3,7.3 0,4.5 4.2,4.5" fill="#FBBF24" transform="scale(0.6)"/>
      <polygon points="6,0 7.8,4.5 12,4.5 8.7,7.3 9.9,12 6,9.5 2.1,12 3.3,7.3 0,4.5 4.2,4.5" fill="#FBBF24" transform="translate(9,0) scale(0.6)"/>
      <polygon points="6,0 7.8,4.5 12,4.5 8.7,7.3 9.9,12 6,9.5 2.1,12 3.3,7.3 0,4.5 4.2,4.5" fill="#FBBF24" transform="translate(18,0) scale(0.6)"/>
      <polygon points="6,0 7.8,4.5 12,4.5 8.7,7.3 9.9,12 6,9.5 2.1,12 3.3,7.3 0,4.5 4.2,4.5" fill="#FBBF24" transform="translate(27,0) scale(0.6)"/>
      <polygon points="6,0 7.8,4.5 12,4.5 8.7,7.3 9.9,12 6,9.5 2.1,12 3.3,7.3 0,4.5 4.2,4.5" fill="#E5E7EB" transform="translate(36,0) scale(0.6)"/>
    </g>
  </g>
  <g filter="url(#shadow2)">
    <rect x="420" y="132" width="100" height="64" rx="12" fill="white"/>
    <text x="470" y="158" fill="#DC2626" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">12</text>
    <text x="470" y="178" fill="#9CA3AF" font-family="sans-serif" font-size="10" text-anchor="middle">Urgent</text>
  </g>

  <!-- Chart area -->
  <g filter="url(#shadow2)">
    <rect x="84" y="210" width="220" height="130" rx="12" fill="white"/>
    <text x="100" y="234" fill="#6B7280" font-family="sans-serif" font-size="11" font-weight="500">Sentiment Trend</text>
    <!-- Bar chart -->
    <rect x="100" y="290" width="18" height="40" rx="4" fill="url(#grad3)" opacity="0.6"/>
    <rect x="124" y="278" width="18" height="52" rx="4" fill="url(#grad3)" opacity="0.7"/>
    <rect x="148" y="266" width="18" height="64" rx="4" fill="url(#grad3)" opacity="0.75"/>
    <rect x="172" y="274" width="18" height="56" rx="4" fill="url(#grad3)" opacity="0.8"/>
    <rect x="196" y="258" width="18" height="72" rx="4" fill="url(#grad3)" opacity="0.85"/>
    <rect x="220" y="250" width="18" height="80" rx="4" fill="url(#grad3)" opacity="0.9"/>
    <rect x="244" y="254" width="18" height="76" rx="4" fill="url(#grad3)" opacity="0.85"/>
    <rect x="268" y="246" width="18" height="84" rx="4" fill="url(#grad3)"/>
  </g>

  <!-- Donut chart -->
  <g filter="url(#shadow2)">
    <rect x="316" y="210" width="204" height="130" rx="12" fill="white"/>
    <text x="332" y="234" fill="#6B7280" font-family="sans-serif" font-size="11" font-weight="500">Dialects</text>
    <circle cx="396" cy="290" r="36" fill="none" stroke="#E5E7EB" stroke-width="10"/>
    <circle cx="396" cy="290" r="36" fill="none" stroke="#4F46E5" stroke-width="10" stroke-dasharray="90 226" stroke-dashoffset="0" transform="rotate(-90 396 290)"/>
    <circle cx="396" cy="290" r="36" fill="none" stroke="#7C3AED" stroke-width="10" stroke-dasharray="56 226" stroke-dashoffset="-90" transform="rotate(-90 396 290)"/>
    <circle cx="396" cy="290" r="36" fill="none" stroke="#A78BFA" stroke-width="10" stroke-dasharray="40 226" stroke-dashoffset="-146" transform="rotate(-90 396 290)"/>
    <!-- Legend -->
    <circle cx="458" cy="262" r="4" fill="#4F46E5"/>
    <text x="468" y="266" fill="#6B7280" font-family="sans-serif" font-size="10">Najdi</text>
    <circle cx="458" cy="282" r="4" fill="#7C3AED"/>
    <text x="468" y="286" fill="#6B7280" font-family="sans-serif" font-size="10">Hijazi</text>
    <circle cx="458" cy="302" r="4" fill="#A78BFA"/>
    <text x="468" y="306" fill="#6B7280" font-family="sans-serif" font-size="10">Sharqi</text>
  </g>

  <!-- Floating review card (top-right, tilted) -->
  <g transform="translate(440, 20) rotate(6)" filter="url(#shadow2)">
    <rect x="0" y="0" width="150" height="70" rx="12" fill="white"/>
    <circle cx="24" cy="24" r="12" fill="url(#grad2)"/>
    <text x="24" y="28" fill="white" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">A</text>
    <rect x="44" y="16" width="80" height="8" rx="4" fill="#E5E7EB"/>
    <rect x="44" y="30" width="60" height="6" rx="3" fill="#F3F4F6"/>
    <rect x="12" y="48" width="36" height="14" rx="7" fill="#ECFDF5"/>
    <text x="30" y="58" fill="#059669" font-family="sans-serif" font-size="8" font-weight="600" text-anchor="middle">9.2</text>
    <rect x="54" y="48" width="42" height="14" rx="7" fill="#EEF2FF"/>
    <text x="75" y="58" fill="#4F46E5" font-family="sans-serif" font-size="8" text-anchor="middle">Najdi</text>
  </g>

  <!-- Floating notification (bottom-left) -->
  <g transform="translate(10, 370) rotate(-4)" filter="url(#shadow2)">
    <rect x="0" y="0" width="160" height="52" rx="12" fill="white"/>
    <circle cx="24" cy="26" r="12" fill="#ECFDF5"/>
    <text x="24" y="30" fill="#059669" font-family="sans-serif" font-size="12" text-anchor="middle">✓</text>
    <text x="44" y="22" fill="#374151" font-family="sans-serif" font-size="9" font-weight="600">Reply Sent!</text>
    <text x="44" y="36" fill="#9CA3AF" font-family="sans-serif" font-size="8">Auto-reply in Najdi dialect</text>
  </g>
</svg>
