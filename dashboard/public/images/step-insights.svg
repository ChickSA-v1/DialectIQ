<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="i1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="i2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="i3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#i1)"/>
  <!-- Chart card -->
  <rect x="48" y="52" width="104" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Mini bar chart -->
  <rect x="60" y="90" width="14" height="30" rx="3" fill="url(#i3)" opacity="0.5"/>
  <rect x="80" y="80" width="14" height="40" rx="3" fill="url(#i3)" opacity="0.7"/>
  <rect x="100" y="70" width="14" height="50" rx="3" fill="url(#i3)" opacity="0.85"/>
  <rect x="120" y="60" width="14" height="60" rx="3" fill="url(#i3)"/>
  <!-- Trend arrow up -->
  <path d="M64 78l30-16 20 6 24-12" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="138,56 130,60 134,52" fill="#059669"/>
  <!-- Reply card floating -->
  <rect x="80" y="140" width="100" height="42" rx="8" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="90" y="150" width="44" height="6" rx="3" fill="#EEF2FF"/>
  <rect x="90" y="162" width="72" height="6" rx="3" fill="#F3F4F6"/>
  <!-- Send icon -->
  <circle cx="160" cy="150" r="10" fill="url(#i2)"/>
  <path d="M156 150l8-3v6z" fill="white"/>
  <!-- Notification bell -->
  <circle cx="56" cy="148" r="16" fill="#FEF3C7"/>
  <text x="56" y="153" fill="#D97706" font-family="sans-serif" font-size="14" text-anchor="middle">!</text>
</svg>
